extends: table1_2d.yaml

experiment_name: synapse-fairdiff-nnunet

runtime:
  device: cuda
  seed: 42
  deterministic: false
  num_workers: 4
  output_dir: outputs

dataset:
  factory: nam.data.synapse.dataset:build_dataset
  root: nam/data/synapse
  ignore_index: -100
  train_items: []
  val_items: []

synthetic_dataset:
  factory: nam.data.common:build_generated_dataset
  root: outputs/synthetic/fairdiff/synapse-fairdiff-nnunet-nam
  ignore_index: -100
  train_items: []
  val_items: []

diffusion:
  name: fairdiff
  project_dir: third_party/FairDiff
  config: MaskImageGen/models/cldm_v15.yaml
  checkpoint: nam/diffusion/2D_M2I/fairdiff/checkpoints/diffusion/synapse/best.ckpt
  checkpoint_strict: false
  resolution: 256
  noise_channels: 4
  noise_size: [32, 32]
  prediction_type: epsilon
  # Paper protocol: deterministic 50-step DDIM instead of upstream 20 steps.
  full_schedule_steps: 50
  num_classes: 10
  # Upstream consumes RGB label PNGs; palette makes canonical IDs explicit.
  mask_encoding: palette
  sd_locked: false
  only_mid_control: false
  control_strength: 1.0
  # Paper class-aware prompt for the Synapse experiment.
  default_prompt: a CT imaging of [aorta, gallbladder, kidney, liver, pancreas, spleen, stomach]
  # The following strings intentionally preserve public infer.py verbatim.
  positive_prompt: low quality, blurry
  negative_prompt: lowres,extra digit, fewer digits, cropped, worst quality

anchor:
  name: nnunet
  spatial_dims: 2
  checkpoint: nam/downstream/real_checkpoint/synapse/nnunet/best.pt
  in_channels: 3
  num_classes: 10
  model:
    stages: 6
    deep_supervision: true

downstream:
  name: nnunet
  spatial_dims: 2
  checkpoint: nam/downstream/syn_checkpoint/synapse/fairdiff/{model}/best.pt
  real_checkpoint: nam/downstream/real_checkpoint/synapse/{model}/best.pt
  syn_checkpoint: nam/downstream/syn_checkpoint/synapse/fairdiff/{model}/best.pt
  real_checkpoint_root: nam/downstream/real_checkpoint/{dataset}/{model}
  syn_checkpoint_root: nam/downstream/syn_checkpoint/{dataset}/{generator}/{model}
  in_channels: 3
  num_classes: 10
  model:
    stages: 6
    deep_supervision: true

miner:
  base_channels: 79
  head_channels: 98
  channel_multipliers: [1, 2, 4, 4]
  downsample_levels: 2
  attention_heads: 4
  variance_bound: 0.95

fairdiff:
  checkpoints:
    pretrained_root: nam/diffusion/2D_M2I/fairdiff/pretrained_weights
    diffusion_root: nam/diffusion/2D_M2I/fairdiff/checkpoints/diffusion/synapse
    nam_root: nam/diffusion/2D_M2I/fairdiff/checkpoints/nam/synapse
    nam_miner: nam/diffusion/2D_M2I/fairdiff/checkpoints/nam/synapse/nam_latest.pt
    downstream_root: nam/diffusion/2D_M2I/fairdiff/checkpoints/downstream/synapse
  pre_training:
    initialization_checkpoint: nam/diffusion/2D_M2I/fairdiff/pretrained_weights/control_sd15_seg.pth
    resume_checkpoint: ""
    output_dir: nam/diffusion/2D_M2I/fairdiff/checkpoints/diffusion/synapse/runs
    batch_size_per_gpu: 4
    learning_rate: 0.00001
    sd_locked: false
    only_mid_control: false
    # Public train.py relies on Lightning's default 1000 epochs. A positive
    # max_iterations overrides this only for controlled ablations/debugging.
    max_epochs: 1000
    max_iterations: 0
    gradient_clip: 1.0
    validation_every: 500
    validation_batch_size: 4
    validation_batches: 16
    validation_ddim_steps: 50
    validation_cfg_scale: 9.0
  nam_training:
    reward: lce
    sample_every: 100
    max_iterations: 3000
    batch_size_per_gpu: 8
    learning_rate: 0.0001
    weight_decay: 0.01
    beta: 0.001
    kappa_up: 0.5
    truncated_steps: 10
    cfg_scale: 9.0
    gradient_clip: 1.0
    save_every: 500
  sampling:
    batch_size: 4
    # Fixed budget equals the paper's Synapse training-mask count.
    budget: 2645
    ddim_steps: 50
    cfg_scale: 9.0
    output_dir: outputs/synthetic/fairdiff

nnunet:
  real_training:
    epochs: 1000
    iterations_per_epoch: 250
    batch_size: 4
    learning_rate: 0.01
    weight_decay: 0.00003
    batch_dice: false
    validation_every: 1
  synthetic_training:
    real_checkpoint: nam/downstream/real_checkpoint/synapse/nnunet/best.pt
    epochs: 100
    iterations_per_epoch: 250
    batch_size_per_stream: 4
    learning_rate: 0.01
    weight_decay: 0.00003
    batch_dice: false
    cutmix_probability: 0.5
    validation_every: 1

swinunet:
  real_training_2d:
    epochs: 150
    batch_size: 24
    learning_rate: 0.05
    weight_decay: 0.0001
    gradient_clip: 12.0
    validation_every: 1
  synthetic_training_2d:
    real_checkpoint: nam/downstream/real_checkpoint/synapse/swinunet/best.pt
    epochs: 100
    batch_size_per_stream: 4
    learning_rate: 0.05
    weight_decay: 0.0001
    gradient_clip: 12.0
    cutmix_probability: 0.5
    validation_every: 1

samed:
  real_training:
    epochs: 200
    stop_epoch: 160
    batch_size: 12
    learning_rate: 0.005
    weight_decay: 0.1
    warmup_iterations: 250
    validation_every: 1
  synthetic_training:
    real_checkpoint: nam/downstream/real_checkpoint/synapse/samed/best.pt
    epochs: 100
    batch_size_per_stream: 4
    learning_rate: 0.005
    weight_decay: 0.1
    warmup_iterations: 250
    cutmix_probability: 0.5
    validation_every: 1

evaluation:
  batch_size: 8
  output: outputs/evaluation/synapse-fairdiff-nnunet.json

adversariality:
  dataset: synthetic_dataset
  split: train
  budget: 2645
  batch_size: 8
  proxy: lcbce
  output: outputs/evaluation/synapse-fairdiff-nnunet-adversariality.csv

visualization:
  tsne:
    output_dir: outputs/evaluation/Vis/synapse-fairdiff-nnunet-tsne

fid:
  # MRI/CT experiments use the paper's RadImageNet ResNet-50 feature space.
  feature_factory: nam.evaluation.feature_extractors:build_feature_extractor
  encoder: radimagenet_resnet50
  checkpoint: pretrained_weights/fid/radimagenet_resnet50.pt
  output: outputs/evaluation/synapse-fairdiff-fid.json
  modality: CT
