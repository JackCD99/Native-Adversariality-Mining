extends: table1_2d.yaml

experiment_name: polyps-diffboost-nnunet

runtime:
  device: cuda
  seed: 42
  deterministic: false
  num_workers: 4
  output_dir: outputs

dataset:
  factory: nam.data.polyps.dataset:build_dataset
  root: nam/data/polyps
  ignore_index: -100
  train_items: []
  val_items: []

synthetic_dataset:
  factory: nam.data.common:build_generated_dataset
  root: outputs/synthetic/diffboost/polyps-diffboost-nnunet-nam
  ignore_index: -100
  train_items: []
  val_items: []

diffusion:
  name: diffboost
  project_dir: third_party/DiffBoost
  config: diffusion/ControlNet/models/cldm_v15.yaml
  checkpoint: nam/diffusion/2D_M2I/diffboost/checkpoints/diffusion/polyps/best.ckpt
  checkpoint_strict: false
  resolution: 256
  noise_channels: 4
  noise_size: [32, 32]
  prediction_type: epsilon
  full_schedule_steps: 50
  # Paper modification: replace the official edge condition with the mask.
  condition_mode: mask
  num_classes: 2
  sd_locked: true
  only_mid_control: false
  control_strength: 1.0
  default_prompt: a colonoscopy image of a polyp
  augmentation_prompt: Image enhancement
  positive_prompt: best quality, extremely detailed
  negative_prompt: longbody, lowres, bad anatomy, cropped, worst quality, low quality
  # Official DiffBoost segmentation_sample.py text-embedding mixture.
  prompt_weights: [0.045, 0.005, 0.95]

anchor:
  name: nnunet
  spatial_dims: 2
  checkpoint: nam/downstream/real_checkpoint/polyps/nnunet/best.pt
  in_channels: 3
  num_classes: 2
  model:
    stages: 6
    deep_supervision: true

downstream:
  name: nnunet
  spatial_dims: 2
  checkpoint: nam/downstream/syn_checkpoint/polyps/diffboost/{model}/best.pt
  real_checkpoint: nam/downstream/real_checkpoint/polyps/{model}/best.pt
  syn_checkpoint: nam/downstream/syn_checkpoint/polyps/diffboost/{model}/best.pt
  real_checkpoint_root: nam/downstream/real_checkpoint/{dataset}/{model}
  syn_checkpoint_root: nam/downstream/syn_checkpoint/{dataset}/{generator}/{model}
  in_channels: 3
  num_classes: 2
  model:
    stages: 6
    deep_supervision: true

miner:
  base_channels: 79
  head_channels: 98
  channel_multipliers: [1, 2, 4, 4]
  downsample_levels: 2
  attention_heads: 4
  variance_bound: 0.95

diffboost:
  checkpoints:
    pretrained_root: nam/diffusion/2D_M2I/diffboost/pretrained_weights
    diffusion_root: nam/diffusion/2D_M2I/diffboost/checkpoints/diffusion/polyps
    nam_root: nam/diffusion/2D_M2I/diffboost/checkpoints/nam/polyps
    nam_miner: nam/diffusion/2D_M2I/diffboost/checkpoints/nam/polyps/nam_latest.pt
    downstream_root: nam/diffusion/2D_M2I/diffboost/checkpoints/downstream/polyps
  pre_training:
    initialization_checkpoint: nam/diffusion/2D_M2I/diffboost/pretrained_weights/radimagenet/model.ckpt
    resume_checkpoint: ""
    output_dir: nam/diffusion/2D_M2I/diffboost/checkpoints/diffusion/polyps/runs
    batch_size_per_gpu: 32
    max_iterations: 50000
    learning_rate: 0.000001
    sd_locked: true
    only_mid_control: false
    rotation_degrees: 20.0
    scale_range: [0.75, 1.05]
    gradient_clip: 1.0
    validation_every: 500
    validation_batch_size: 8
    validation_batches: 16
    validation_ddim_steps: 50
    validation_cfg_scale: 9.0
  nam_training:
    reward: lce
    sample_every: 100
    max_iterations: 3000
    batch_size_per_gpu: 8
    learning_rate: 0.0001
    weight_decay: 0.01
    beta: 0.001
    kappa_up: 0.5
    truncated_steps: 10
    cfg_scale: 9.0
    gradient_clip: 1.0
    save_every: 500
  sampling:
    batch_size: 4
    budget: 1128
    ddim_steps: 50
    cfg_scale: 9.0
    output_dir: outputs/synthetic/diffboost

nnunet:
  real_training:
    epochs: 1000
    iterations_per_epoch: 250
    batch_size: 4
    learning_rate: 0.01
    weight_decay: 0.00003
    batch_dice: false
    validation_every: 1
  synthetic_training:
    real_checkpoint: nam/downstream/real_checkpoint/polyps/nnunet/best.pt
    epochs: 100
    iterations_per_epoch: 250
    batch_size_per_stream: 4
    learning_rate: 0.01
    weight_decay: 0.00003
    batch_dice: false
    cutmix_probability: 0.5
    validation_every: 1

swinunet:
  real_training_2d:
    epochs: 150
    batch_size: 24
    learning_rate: 0.05
    weight_decay: 0.0001
    gradient_clip: 12.0
    validation_every: 1
  synthetic_training_2d:
    real_checkpoint: nam/downstream/real_checkpoint/polyps/swinunet/best.pt
    epochs: 100
    batch_size_per_stream: 4
    learning_rate: 0.05
    weight_decay: 0.0001
    gradient_clip: 12.0
    cutmix_probability: 0.5
    validation_every: 1

samed:
  real_training:
    epochs: 200
    stop_epoch: 160
    batch_size: 12
    learning_rate: 0.005
    weight_decay: 0.1
    warmup_iterations: 250
    validation_every: 1
  synthetic_training:
    real_checkpoint: nam/downstream/real_checkpoint/polyps/samed/best.pt
    epochs: 100
    batch_size_per_stream: 4
    learning_rate: 0.005
    weight_decay: 0.1
    warmup_iterations: 250
    cutmix_probability: 0.5
    validation_every: 1

evaluation:
  batch_size: 8
  output: outputs/evaluation/polyps-diffboost-nnunet.json

adversariality:
  dataset: synthetic_dataset
  split: train
  budget: 1128
  batch_size: 8
  proxy: lcbce
  output: outputs/evaluation/polyps-diffboost-nnunet-adversariality.csv

visualization:
  tsne:
    output_dir: outputs/evaluation/Vis/polyps-diffboost-nnunet-tsne

fid:
  # RGB: Inception-v3. MRI/CT: RadImageNet ResNet-50.
  feature_factory: nam.evaluation.feature_extractors:build_feature_extractor
  encoder: inception_v3
  output: outputs/evaluation/polyps-diffboost-fid.json
  modality: RGB
