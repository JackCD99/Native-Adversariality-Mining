extends: table1_3d.yaml

experiment_name: la-maisi-nnunet

synthetic_dataset:
  factory: nam.data.common:build_generated_dataset
  root: outputs/synthetic/seed_42/la-maisi-nnunet-nam

runtime:
  device: cuda
  seed: 42
  miner_seed: 42
  downstream_seed: 42
  sampling_seed: 42
  deterministic: false
  num_workers: 2
  output_dir: outputs/maisi

dataset:
  factory: nam.data.la.dataset:build_dataset
  root: nam/data/la
  ignore_index: -100
  train_items: []
  val_items: []

diffusion:
  name: maisi
  project_dir: third_party/monai-tutorials/generation/maisi
  official_config: configs/config_maisi3d-ddpm.json
  autoencoder_checkpoint: pretrained_weights/maisi/autoencoder_v1.pt
  diffusion_checkpoint: pretrained_weights/maisi/diff_unet_3d_ddpm.pt
  checkpoint: checkpoints/maisi/diffusion/best.pt
  scale_factor: 1.0
  volume_size: [192, 192, 96]
  noise_channels: 4
  noise_size: [48, 48, 24]
  full_schedule_steps: 50
  spacing: [1.0, 1.0, 1.0]
  top_region: [0.0, 1.0, 0.0, 0.0]
  bottom_region: [0.0, 1.0, 0.0, 0.0]
  modality: 1
  default_prompt: a MRI imaging of left atrium

anchor:
  name: nnunet
  spatial_dims: 3
  checkpoint: nam/downstream/real_checkpoint/la/nnunet/best.pt
  in_channels: 1
  num_classes: 2

downstream:
  name: nnunet
  spatial_dims: 3
  checkpoint: nam/downstream/syn_checkpoint/la/maisi/{model}/best.pt
  real_checkpoint: nam/downstream/real_checkpoint/la/{model}/best.pt
  syn_checkpoint: nam/downstream/syn_checkpoint/la/maisi/{model}/best.pt
  real_checkpoint_root: nam/downstream/real_checkpoint/{dataset}/{model}
  syn_checkpoint_root: nam/downstream/syn_checkpoint/{dataset}/{generator}/{model}
  in_channels: 1
  num_classes: 2

evaluation:
  batch_size: 1
  output: outputs/evaluation/la-maisi-nnunet.json

adversariality:
  dataset: synthetic_dataset
  split: train
  budget: 70
  batch_size: 1
  proxy: lcbce
  output: outputs/evaluation/la-maisi-nnunet-adversariality.csv

visualization:
  tsne:
    output_dir: outputs/evaluation/Vis/la-maisi-nnunet-tsne

miner:
  # 25.176M parameters (25.174M after the paper's rounded reporting).
  in_channels: 4
  head_channels: 42
  base_channels: 82
  channel_multipliers: [1, 2, 4, 4]
  downsample_levels: 2
  attention_heads: 4
  variance_bound: 0.95

training:
  reward: lce
  sample_every: 100
  max_iterations: 3000
  batch_size_per_gpu: 1
  learning_rate: 0.0001
  weight_decay: 0.01
  beta: 0.001
  kappa_up: 0.5
  truncated_steps: 10
  cfg_scale: 1.0
  gradient_clip: 1.0
  save_every: 500
  stable_checkpoint: checkpoints/maisi/nam/nam_latest.pt

maisi:
  checkpoints:
    diffusion_root: checkpoints/maisi/diffusion
    nam_root: checkpoints/maisi/nam
    nam_miner: checkpoints/maisi/nam/nam_latest.pt
  pre_training:
    max_epochs: 100
    max_iterations: 0
    batch_size_per_gpu: 1
    learning_rate: 0.00001
    gradient_clip: 1.0
    validation_every: 500
    validation_batch_size: 1
    validation_batches: 10
    validation_ddim_steps: 50
  sampling:
    batch_size: 1
    budget: 70
    ddim_steps: 50
    cfg_scale: 1.0
    output_dir: outputs/synthetic
    augment_conditions: true
    flip_probability: 0.5
    scale_range: [0.9, 1.1]

fid:
  feature_factory: nam.evaluation.feature_extractors:build_feature_extractor
  encoder: radimagenet_resnet50
  checkpoint: pretrained_weights/fid/radimagenet_resnet50.pt
  batch_size: 16
  output: outputs/evaluation/la-maisi-fid.json
  real_split: test
  synthetic_split: train
