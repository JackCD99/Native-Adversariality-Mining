extends: table1_2d.yaml

experiment_name: synapse-medsegfactory-nnunet
runtime: {device: cuda, seed: 42, miner_seed: 42, downstream_seed: 42, sampling_seed: 42, deterministic: false, num_workers: 4}
dataset:
  factory: nam.data.synapse.dataset:build_dataset
  root: nam/data/synapse
  ignore_index: -100
  train_items: []
  val_items: []
diffusion:
  name: medsegfactory
  project_dir: third_party/MedSegFactory
  base_model: pretrained_weights/medsegfactory/stable-diffusion-v1-5
  checkpoint: checkpoints/medsegfactory/diffusion/synapse/best.pt
  resolution: 256
  num_classes: 10
  noise_size: [32, 32]
  full_schedule_steps: 50
  image_prompt: a CT image of abdominal organs
  mask_prompt: an abdominal multi-organ segmentation mask
  negative_prompt: low quality, artifacts
anchor: {name: nnunet, spatial_dims: 2, checkpoint: nam/downstream/real_checkpoint/synapse/nnunet/best.pt, in_channels: 3, num_classes: 10}
downstream:
  name: nnunet
  spatial_dims: 2
  checkpoint: nam/downstream/syn_checkpoint/synapse/medsegfactory/{model}/best.pt
  real_checkpoint: nam/downstream/real_checkpoint/synapse/{model}/best.pt
  syn_checkpoint: nam/downstream/syn_checkpoint/synapse/medsegfactory/{model}/best.pt
  real_checkpoint_root: nam/downstream/real_checkpoint/{dataset}/{model}
  syn_checkpoint_root: nam/downstream/syn_checkpoint/{dataset}/{generator}/{model}
  in_channels: 3
  num_classes: 10
synthetic_dataset:
  factory: nam.data.common:build_generated_dataset
  root: outputs/synthetic/seed_42/synapse-medsegfactory-nnunet-nam
evaluation:
  batch_size: 8
  output: outputs/evaluation/synapse-medsegfactory-nnunet.json
adversariality:
  dataset: synthetic_dataset
  split: train
  budget: 2645
  batch_size: 8
  proxy: lcbce
  output: outputs/evaluation/synapse-medsegfactory-nnunet-adversariality.csv
visualization:
  tsne:
    output_dir: outputs/evaluation/Vis/synapse-medsegfactory-nnunet-tsne
miner: {variance_bound: 0.95}
medsegfactory:
  checkpoints:
    diffusion_root: checkpoints/medsegfactory/diffusion/synapse
    nam_root: checkpoints/medsegfactory/nam/synapse
    nam_miner: checkpoints/medsegfactory/nam/synapse/nam_latest.pt
  pre_training:
    max_epochs: 10000
    max_iterations: 0
    batch_size_per_gpu: 20
    learning_rate: 0.00001
    weight_decay: 0.01
    gradient_clip: 1.0
    horizontal_flip_probability: 0.0
    validation_every: 500
    validation_batch_size: 1
    validation_batches: 10
    validation_ddim_steps: 50
    validation_cfg_scale: 7.5
  nam_training:
    reward: lce
    sample_every: 100
    max_iterations: 3000
    batch_size_per_gpu: 1
    learning_rate: 0.0001
    weight_decay: 0.01
    beta: 0.001
    kappa_up: 0.5
    truncated_steps: 10
    cfg_scale: 7.5
    gradient_clip: 1.0
    save_every: 500
  sampling: {batch_size: 1, budget: 2645, ddim_steps: 50, cfg_scale: 7.5, output_dir: outputs/synthetic}
fid: {feature_factory: nam.evaluation.feature_extractors:build_feature_extractor, encoder: radimagenet_resnet50, checkpoint: pretrained_weights/fid/radimagenet_resnet50.pt, output: outputs/evaluation/synapse-medsegfactory-fid.json}

nnunet:
  synthetic_training:
    real_checkpoint: nam/downstream/real_checkpoint/synapse/nnunet/best.pt
swinunet:
  synthetic_training_2d:
    real_checkpoint: nam/downstream/real_checkpoint/synapse/swinunet/best.pt
samed:
  synthetic_training:
    real_checkpoint: nam/downstream/real_checkpoint/synapse/samed/best.pt
